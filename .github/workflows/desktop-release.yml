name: Desktop release
on:
  workflow_dispatch:          # the "Run workflow" button
  push:
    branches: [main]
    paths:                    # any change to the desktop app (or this file) builds the installers by itself
      - "desktop/**"
      - ".github/workflows/desktop-release.yml"
    tags: ["desktop-v*"]      # a tag like desktop-v0.1.0 also makes a public release
permissions:
  contents: write
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true    # a newer commit stops the older build
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the installer
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --publish never
        env:
          # Optional signing (without these the installers are unsigned and the OS shows a warning):
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          retention-days: 14
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')   # only a tag makes a public release; other builds just keep the files as downloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum AgenticVenus-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
