name: Desktop release
on:
  workflow_dispatch:          # the "Run workflow" button (builds only, nothing is published)
  push:
    branches: [main]
    paths:                    # any change to the desktop app (or this file) builds the installers by itself
      - "desktop/**"
      - ".github/workflows/desktop-release.yml"
  release:
    types: [published]        # you publish an EMPTY release (any name, any tag): Windows, Mac, Linux and Android files are attached by themselves
permissions:
  contents: write
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true    # a newer commit stops the older build
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the installer
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned test builds (add real signing later)
          DEBUG: electron-builder                # more detail in the log if a build fails
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          retention-days: 14
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage

  # The Android app is built by .github/workflows/android.yml (needs the secrets APP_URL and GOOGLE_SERVICES_JSON)
  android:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/android.yml
    secrets: inherit

  attach:
    needs: [build, android]
    # runs even if the Android build failed, so the PC installers still get attached
    if: ${{ always() && github.event_name == 'release' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Name the files and write checksums
        run: |
          cd assets
          if [ -f app-debug.apk ]; then mv app-debug.apk AgenticVenus-android.apk; else echo "::warning::The Android app was not built (check the secrets APP_URL and GOOGLE_SERVICES_JSON)."; fi
          ls -l
          sha256sum AgenticVenus-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attach everything to the release you published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" assets/* --clobber --repo "${{ github.repository }}"