name: AgenticVenus routine runner

# Runs on GitHub's own infrastructure, on a timer — not Vercel, and not
# your own machine. This is the iPad-friendly way to run the personal
# scheduler: everything here is set up through the GitHub app/website,
# no terminal needed.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes. GitHub may delay this a
      # few minutes under load — fine for a personal routine system.
  workflow_dispatch: {} # adds a manual "Run workflow" button too, for testing

jobs:
  ping-routines:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/routines/run
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/routines/run" \
            -H "Authorization: Bearer ${{ secrets.ROUTINE_RUNNER_SECRET }}"
