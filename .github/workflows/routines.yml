name: AgenticVenus routine runner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping-routines:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/routines/run
        env:
          APP_URL: ${{ secrets.APP_URL }}
          RUNNER_SECRET: ${{ secrets.ROUTINE_RUNNER_SECRET }}
        run: |
          URL="${APP_URL%/}/api/routines/run"
          STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer $RUNNER_SECRET")
          echo "HTTP status: $STATUS"
          cat response.txt
          echo
          if [ "$STATUS" -ge 400 ]; then
            echo "::error::Routine endpoint returned HTTP $STATUS"
            exit 1
          fi

      - name: Keep background coding jobs alive and finish unattended ones
        env:
          APP_URL: ${{ secrets.APP_URL }}
          RUNNER_SECRET: ${{ secrets.ROUTINE_RUNNER_SECRET }}
        run: |
          URL="${APP_URL%/}/api/runner/tick"
          STATUS=$(curl -s -o tick.txt -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer $RUNNER_SECRET")
          echo "HTTP status: $STATUS"
          cat tick.txt
          echo
          if [ "$STATUS" -ge 400 ]; then
            echo "::error::Runner tick returned HTTP $STATUS"
            exit 1
          fi

      - name: Keep missions moving (safety net)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          RUNNER_SECRET: ${{ secrets.ROUTINE_RUNNER_SECRET }}
        run: |
          URL="${APP_URL%/}/api/missions/tick"
          STATUS=$(curl -s -o m.txt -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer $RUNNER_SECRET" -H "Content-Type: application/json" -d '{}')
          echo "HTTP status: $STATUS"
          cat m.txt
          echo
          if [ "$STATUS" -ge 400 ]; then
            echo "::error::Missions tick returned HTTP $STATUS"
            exit 1
          fi