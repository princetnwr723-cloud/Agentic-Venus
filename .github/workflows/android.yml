name: Android APK

# Builds an installable app-debug.apk (a debug build, not a Play Store build).
#   - Run it from the Actions tab ("Run workflow"): the APK appears under "Artifacts".
#   - Type a release tag into "release_tag" and the APK is also attached to that existing release.
#   - The release workflow (desktop-release.yml) calls this file when you publish a release.
# Secrets (Settings -> Secrets and variables -> Actions):
#   APP_URL               REQUIRED. Your website, e.g. https://your-app.vercel.app
#   GOOGLE_SERVICES_JSON  optional. The text of google-services.json from Firebase (Android app: com.agenticvenus.app).
#                         Without it the app still builds and works, only push notifications are off.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional: tag of an existing release to attach the APK to (empty = only build)"
        required: false
        default: ""
  workflow_call: {}          # lets the release workflow build the APK too
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write            # needed only to attach the APK to a release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_URL: ${{ secrets.APP_URL }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          [ -n "$APP_URL" ] || { echo "::error::The secret APP_URL is missing. Add it in Settings -> Secrets and variables -> Actions (your website address, e.g. https://your-app.vercel.app)."; exit 1; }
          [ -n "$GOOGLE_SERVICES_JSON" ] || echo "::warning::GOOGLE_SERVICES_JSON is not set. The app will build, but push notifications will not work."

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # same signing key every time, so a new APK installs over the old app without uninstalling
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: venus-debug-keystore-v1

      - name: Install
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Firebase config
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Prepare (permissions, runner service, icon, login link)
        run: node scripts/prepare-android.mjs

      - name: Sync plugins
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: venus-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach to the release you named
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          cd /tmp
          cp "$GITHUB_WORKSPACE/mobile/android/app/build/outputs/apk/debug/app-debug.apk" AgenticVenus-android.apk
          gh release download "$TAG" -p SHA256SUMS.txt -D /tmp --clobber --repo "${{ github.repository }}" || true
          touch SHA256SUMS.txt
          sed -i '/AgenticVenus-android.apk/d' SHA256SUMS.txt
          sha256sum AgenticVenus-android.apk >> SHA256SUMS.txt
          gh release upload "$TAG" AgenticVenus-android.apk SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
