name: Android APK

# Builds an installable app-debug.apk. Run it from the Actions tab ("Run workflow"), then download the file under "Artifacts".
# Secrets needed (Settings -> Secrets and variables -> Actions):
#   APP_URL               your website, e.g. https://your-app.vercel.app
#   GOOGLE_SERVICES_JSON  the full text of google-services.json from Firebase (Android app: com.agenticvenus.app)
on:
  workflow_dispatch: {}
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_URL: ${{ secrets.APP_URL }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          [ -n "$APP_URL" ] || { echo "::error::Secret APP_URL is missing"; exit 1; }
          [ -n "$GOOGLE_SERVICES_JSON" ] || { echo "::error::Secret GOOGLE_SERVICES_JSON is missing"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # same signing key every time, so a new APK installs over the old app without uninstalling
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: venus-debug-keystore-v1

      - name: Install
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Firebase config
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Prepare (permissions, runner service, icon, login link)
        run: node scripts/prepare-android.mjs

      - name: Sync plugins
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: venus-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error